name: LINCE GUARD - Compilar APK Android

on:
  push:
    branches: [main]
    paths:
      - 'LINCE_GUARD_GITHUB_ACTIONS_LISTO*.zip'
      - '.github/workflows/compilar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Crear APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Localizar y extraer el ZIP Android
        shell: bash
        run: |
          set -euo pipefail
          echo "Paquetes disponibles:"
          find . -maxdepth 1 -type f -name 'LINCE_GUARD_GITHUB_ACTIONS_LISTO*.zip' -print
          ARCHIVE=""
          for candidate in             "LINCE_GUARD_GITHUB_ACTIONS_LISTO (2).zip"             "LINCE_GUARD_GITHUB_ACTIONS_LISTO (1).zip"             "LINCE_GUARD_GITHUB_ACTIONS_LISTO.zip"; do
            if [ -s "$candidate" ]; then
              ARCHIVE="$candidate"
              break
            fi
          done
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No se encontró el ZIP de LINCE GUARD en la raíz."
            exit 1
          fi
          echo "Extrayendo: $ARCHIVE"
          mkdir -p source
          unzip -oq "$ARCHIVE" -d source
          test -s source/app/build.gradle
          test -s source/settings.gradle
          test -s source/test_scangate.sh

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Probar antirrepetición de escaneos
        shell: bash
        working-directory: source
        run: bash test_scangate.sh

      - name: Localizar SDK Manager de Android
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Instalar SDK y Build Tools 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK de depuración
        shell: bash
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Comprobar APK y generar hash
        shell: bash
        run: |
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          cp source/app/build/outputs/apk/debug/app-debug.apk LINCE_GUARD_V0_3_1_DEBUG.apk
          sha256sum LINCE_GUARD_V0_3_1_DEBUG.apk > LINCE_GUARD_V0_3_1_DEBUG.sha256

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: LINCE_GUARD_APK_ANDROID
          path: |
            LINCE_GUARD_V0_3_1_DEBUG.apk
            LINCE_GUARD_V0_3_1_DEBUG.sha256
          if-no-files-found: error
          retention-days: 14
